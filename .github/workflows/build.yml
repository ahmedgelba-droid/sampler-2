name: Build Gelbo Sampler VST3 (Windows)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Gelbo-Sampler-VST3-Windows
          path: build/*_artefacts/Release/VST3
